<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UG COMP — Login</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="account-page">
<header class="topbar"><a class="brand brand-link" href="/">UG <span>COMP</span></a><nav class="nav-links"><a href="/">HOME</a></nav></header>
<main class="center-page">
  <section class="auth-card card reveal">
    <div class="auth-mark">UG<br><small>COMP</small></div>
    <p class="eyebrow">WELCOME BACK</p>
    <h1>UG COMP ACCOUNT</h1>
    <p class="muted auth-copy">Sign in to keep your custom chat name and access your personal battle history. An account is completely optional.</p>
    <button id="googleLoginBtn" class="google-btn wide"><span class="google-g">G</span> CONTINUE WITH GOOGLE</button>
    <button id="guestBtn" class="ghost-btn wide">CONTINUE AS GUEST</button>
    <p id="authMsg" class="muted"></p>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
<script src="/firebase-config.js"></script><script src="/auth.js"></script>
<script>
  const msg = document.getElementById('authMsg');
  document.getElementById('guestBtn').onclick = () => { sessionStorage.setItem('ug_guest','1'); location.href='/'; };
  document.getElementById('googleLoginBtn').onclick = async () => {
    msg.textContent = 'Opening Google login…';
    try { await UGAuth.signInWithGoogle(); await UGAuth.ready; location.href = UGAuth.name ? '/' : '/setup-name.html'; }
    catch (e) { msg.textContent = e.message || 'Google login failed.'; }
  };
  UGAuth.ready.then(() => { if (UGAuth.user) location.href = UGAuth.name ? '/' : '/setup-name.html'; });
</script>
</body></html>
